// Normalize text to make matching easier
function normalize(text) {
  return text
    .toLocaleLowerCase()
    .normalize("NFKC")
    .replace(/[?!.,;:'"()[\]{}।,،]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Edit-distance check helps with small spelling mistakes.
// It does not understand every language or every question.
function similar(a, b) {
  a = normalize(a);
  b = normalize(b);

  if (a === b) return true;
  if (!a || !b) return false;

  if (a.includes(b) || b.includes(a)) {
    return Math.min(a.length, b.length) >= 3;
  }

  if (Math.abs(a.length - b.length) > 2) return false;

  let previous = Array.from(
    { length: b.length + 1 }, (_, i) => i
  );

  for (let i = 1; i <= a.length; i++) {
    const current = [i];

    for (let j = 1; j <= b.length; j++) {
      current[j] = Math.min(
        current[j - 1] + 1,
        previous[j] + 1,
        previous[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }

    previous = current;
  }

  return previous[b.length] <=
    (Math.max(a.length, b.length) > 7 ? 2 : 1);
}

function calculateMath(text) {
  let expression = text.toLowerCase()
    .replace(/what is|calculate|solve|kitna hai|kya hai/g, "")
    .replace(/plus|add|jod/g, "+")
    .replace(/minus|subtract|ghata/g, "-")
    .replace(/times|multiply|into|guna/g, "*")
    .replace(/divided by|divide|baant/g, "/")
    .replace(/[^0-9+\-*/().%\s]/g, "")
    .trim();

  if (!expression || !/[0-9]/.test(expression)) return null;
  if (!/[+\-*/%]/.test(expression)) return null;

  // Safe arithmetic parser: no eval() or Function()
  const tokens = expression.match(/\d+(?:\.\d+)?|[()+\-*/%]/g);
  if (!tokens || tokens.join("") !== expression.replace(/\s/g, "")) {
    return null;
  }

  let position = 0;

  function primary() {
    const token = tokens[position++];

    if (token === "(") {
      const value = addSubtract();
      if (tokens[position++] !== ")") throw Error();
      return value;
    }

    if (token === "-") return -primary();
    if (token === "+") return primary();

    const number = Number(token);
    if (!Number.isFinite(number)) throw Error();
    return number;
  }

  function multiplyDivide() {
    let value = primary();

    while (["*", "/", "%"].includes(tokens[position])) {
      const operator = tokens[position++];
      const next = primary();

      if ((operator === "/" || operator === "%") && next === 0) {
        throw Error();
      }

      if (operator === "*") value *= next;
      if (operator === "/") value /= next;
      if (operator === "%") value %= next;
    }

    return value;
  }

  function addSubtract() {
    let value = multiplyDivide();

    while (tokens[position] === "+" || tokens[position] === "-") {
      const operator = tokens[position++];
      const next = multiplyDivide();

      value = operator === "+" ? value + next : value - next;
    }

    return value;
  }

  try {
    const answer = addSubtract();

    if (position !== tokens.length || !Number.isFinite(answer)) {
      return null;
    }

    return Number(answer.toFixed(8));
  } catch (error) {
    return null;
  }
}

function findAnswer(text) {
  const q = normalize(text);

  // 1. Greetings
  if (/^(hi|hello|hey|salam|namaste|assalamualaikum)$/.test(q)) {
    return "Assalamualaikum bhai! 🌸 Main Luka AI hoon. Aaj kya seekhna hai?";
  }

  // 2. Current time
  if (
    q.includes("time") ||
    q.includes("kitne baje") ||
    q.includes("waqt")
  ) {
    return "Abhi time hai " +
      new Date().toLocaleTimeString("en-IN") + ".";
  }

  // 3. Current date
  if (
    q.includes("today date") ||
    q.includes("aaj ki date") ||
    q.includes("aaj ka din") ||
    q.includes("what is the date")
  ) {
    return "Aaj ki date hai " +
      new Date().toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
      }) + ".";
  }

  // 4. Maths
  if (
    /\d/.test(q) &&
    (/[+\-*/%]/.test(q) ||
     /plus|minus|times|multiply|divide|calculate|kitna hai/.test(q))
  ) {
    const result = calculateMath(q);

    if (result !== null) {
      return "Bhai, answer hai: " + result + " 🧠";
    }

    return "Bhai, maths expression samajh nahi aaya. Dobara try karo.";
  }

  // 5. Luka AI identity
  if (
    q.includes("your name") ||
    q.includes("tumhara naam") ||
    q.includes("who are you")
  ) {
    return "Mera naam Luka AI hai! 🌸 Main tumhara personal assistant hoon.";
  }

  // 6. Better knowledge matching
  for (const item of knowledge) {
    for (const word of item.words) {
      const w = normalize(word);

      if (q === w || (w.length >= 4 && q.includes(w))) {
        return item.answer;
      }
    }
  }

  // 7. Spelling mistake matching
  for (const item of knowledge) {
    for (const word of item.words) {
      const w = normalize(word);

      if (
        Math.abs(q.length - w.length) <= 2 &&
        q.length <= 40 &&
        similar(q, w)
      ) {
        return item.answer;
      }
    }
  }

  // 8. Honest fallback
  return "Bhai, ye interesting question hai! ❤️ Lekin iska jawab abhi meri programmed knowledge mein nahi hai. Main abhi API ke bina basic mode mein hoon.";
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    statusText.textContent = "Voice output supported nahi hai.";
    return;
  }

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = language.value;
  voice.rate = 0.95;

  animeBubble.textContent = text;

  voice.onstart = function() {
    animeAvatar.classList.add("talking");
    animeStatus.textContent = "🗣️ Luka is speaking...";
  };

  voice.onend = function() {
    animeAvatar.classList.remove("talking");
    animeStatus.textContent = "✨ Luka is ready!";
  };

  voice.onerror = function() {
    animeAvatar.classList.remove("talking");
    animeStatus.textContent = "Voice playback error.";
  };

  speechSynthesis.speak(voice);
}

function reply(text) {
  const answer = findAnswer(text);
  addMessage(answer, "bot");
  speak(answer);
}

document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const text = question.value.trim();
  if (!text) return;

  addMessage(text, "user");
  question.value = "";
  reply(text);
});

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

document.getElementById("mic").addEventListener("click", function() {
  if (!SpeechRecognition) {
    statusText.textContent =
      "Voice input supported nahi hai. Supported browser try karo.";
    return;
  }

  if (recognition) {
    try { recognition.abort(); } catch (error) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = language.value;
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    statusText.textContent = "🎤 Sun raha hoon... Ab bolo!";
  };

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;

    addMessage(text, "user");
    reply(text);

    statusText.textContent = "Bhai, tumhari baat sun li!";
  };

  recognition.onerror = function(event) {
    statusText.textContent =
      "Voice error: " + event.error +
      ". Microphone permission aur internet check karo.";
  };

  recognition.onend = function() {
    if (statusText.textContent.includes("Sun raha")) {
      statusText.textContent = "Bhai, dobara Speak dabakar try karo.";
    }
  };

  try {
    recognition.start();
  } catch (error) {
    statusText.textContent = "Dobara Speak dabakar try karo.";
  }
});

document.getElementById("stop").addEventListener("click", function() {
  if (recognition) {
    try { recognition.abort(); } catch (error) {}
  }

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  statusText.textContent = "Voice stop kar di.";
});
</script>
